id: "vague_burrito_bowl_decline_save"
description: "Very vague dish should include explicit assumptions and full review fields."
enabled: true
tags: ["vague", "assumptions", "decline-save", "multi-turn"]

config:
  timeout_seconds: 120
  poll_attempts: 6
  poll_interval_seconds: 2

preconditions:
  expect_sheet_access: false
  require_clean_gateway: false

expectations:
  require_review_fields_each_turn: true
  require_numeric_macros_each_turn: true
  require_confirmation_gate: true
  forbid_logged_before_save: true
  expect_sheet_append_on_save: false
  expected_append_count: 0

turns:
  - role: "user"
    message: "burrito bowl"
    checks:
      must_contain:
        - "Date:"
        - "Time:"
        - "Meal:"
        - "Type:"
        - "Description:"
        - "Calories:"
        - "Fat:"
        - "Carbs:"
        - "Sugar:"
        - "Fiber:"
        - "Protein:"
      field_is_numeric: ["Calories", "Fat", "Carbs", "Sugar", "Fiber", "Protein"]
      must_match_regex:
        - "(assum|assuming|typical|usually|standard|includes|estimated)"
        - "(Would you like to modify anything\\?|Would you like to (?:log|save) this(?: [^?]+)?\\?|Should I save this to your Food Log\\?)"
      must_not_contain:
        - "[Estimate]"
        - "N/A"
        - "Unknown"

  - role: "user"
    message: "no, don't save this"
    checks:
      must_not_match_regex:
        - "\\b(logged|appended|added)\\b"
